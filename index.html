<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:light;--bg:#f3f0e8;--card:#fff;--ink:#1d2a21;--mut:#5f6d63;--line:#dcd8cb;--acc:#2f6b3a;--acc-ink:#fff;--acc-soft:#e3eee4;--warn:#b4561a;--warn-soft:#f8e8da;--bad:#b3312b;--ok:#2f6b3a;--bar:#2f6b3a;--surface:#fff;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--s9:#8a6d3b;--hd:Georgia,'Times New Roman',serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#141a16;--card:#1d2620;--ink:#e8eee9;--mut:#9fb0a4;--line:#2f3b33;--acc:#6fbf7b;--acc-ink:#0f1a12;--acc-soft:#25382a;--warn:#e69a62;--warn-soft:#3a2a1d;--bad:#ff8a80;--ok:#6fbf7b;--bar:#6fbf7b;--surface:#1d2620;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--s9:#b8955a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif}
h1,h2,h3{font-family:var(--hd);margin:0;font-weight:700}h2{font-size:24px}h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
textarea{resize:vertical}label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
button{cursor:pointer}:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:11px 16px;font-weight:600}
.btn.g{background:transparent;color:var(--acc);border:1px solid var(--acc)}.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:6px 10px;font-size:14px}.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mut{color:var(--mut);font-size:14px}.r{text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.grid2.m{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font:700 28px var(--hd)}.kpi span{font-size:13px;color:var(--mut)}
/* shell */
.shell{min-height:100vh;display:flex}
.nav{width:210px;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex:none}
.alist{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;margin-top:16px}.alink{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px;background:none;border:0;color:var(--ink);font:inherit;font-size:15px;line-height:1.25;text-align:center;cursor:pointer}.alink svg{width:44px;height:44px;stroke:var(--acc);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}.alink:hover span{text-decoration:underline}.nav{overflow-y:auto}@media(max-width:800px){.nav{overflow-x:auto}.nav button.n{flex:0 0 auto;min-width:64px}}.area-sel{font:500 14px system-ui!important;width:100%;padding:8px 10px!important}.top .area-sel{width:auto;flex:1;margin:0 8px!important}.brand{font:700 19px var(--hd);padding:0 8px 12px}.brand small{display:block;font:400 12px system-ui;color:var(--mut)}
.nav button.n{display:flex;gap:10px;align-items:center;background:none;border:0;text-align:left;padding:10px;border-radius:8px;color:var(--ink);font-weight:600}
.nav button.n.on{background:var(--acc-soft);color:var(--acc)}.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav .who{margin-top:auto;padding:10px 8px;font-size:13px;color:var(--mut);border-top:1px solid var(--line)}
.soon{padding:8px 10px;font-size:13px;color:var(--mut)}.soon b{display:block;margin-bottom:2px}
main{flex:1;min-width:0;padding:20px;max-width:1100px;margin:0 auto;width:100%}
@media(max-width:800px){.shell{display:block}.nav{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20;gap:0}
 .nav .brand,.nav .who,.nav .soon{display:none}.nav button.n{flex:1;flex-direction:column;gap:2px;font-size:11px;text-align:center;padding:7px 2px}main{padding:14px 14px 90px}}
.top{display:none}@media(max-width:800px){.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 0}.top b{font:700 17px var(--hd)}}
/* login */
.login{max-width:380px;margin:12vh auto;padding:0 16px}.login .card{padding:20px}.err{color:var(--bad);font-size:14px;margin-top:10px}
/* lists */
.it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.it:last-child{border-bottom:0}
.it .h{font:700 18px var(--hd);min-width:52px}.it .t{font-weight:600}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700;background:var(--acc-soft);color:var(--acc)}.tag.w{background:var(--warn-soft);color:var(--warn)}.tag.x{background:var(--line);color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:6px 12px;font-size:14px}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fab{position:fixed;right:18px;bottom:84px;z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:28px;padding:14px 20px}
@media(min-width:801px){.fab{bottom:24px}}
dialog{border:0;border-radius:14px;background:var(--bg);color:var(--ink);width:min(94vw,460px);max-height:92vh;padding:18px}dialog::backdrop{background:rgba(0,0,0,.45)}
.chk{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink);margin:12px 0}.chk input{width:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:99;max-width:90vw}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--mut);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.agit{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.agbadge{font-size:11px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:1px 7px;font-weight:600;white-space:nowrap}

/* ---- caricamento PDF in blocco ---- */
function bulkNorm(s){return String(s).toUpperCase().replace(/[^A-Z0-9]/g,'')}
var BULK_ALIAS={VAILLANT:'VALIANT',MYKONOS:'MIKONOS',CENTURYSL:'CENTURY'};
function bulkMatch(fn){var n=bulkNorm(fn.replace(/\.pdf$/i,''));Object.keys(BULK_ALIAS).forEach(function(k){n=n.split(k).join(BULK_ALIAS[k])});var best=null,bl=0;
 F.prod.forEach(function(p){var keys=[bulkNorm(p.nome),bulkNorm(p.nome.split(' ')[0])];if(p.reg_n)keys.push('R'+bulkNorm(p.reg_n));
  var pn=p.nome;Object.keys(BULK_ALIAS).forEach(function(k){pn=pn.toUpperCase().split(k).join(BULK_ALIAS[k])});keys.push(bulkNorm(pn),bulkNorm(pn.split(' ')[0]));
  keys.forEach(function(k){if(k.length<4)return;var hit=k.charAt(0)==='R'&&/^R\d+$/.test(k)?n.indexOf(k.slice(1))>=0:n.indexOf(k)>=0;if(hit&&k.length>bl){bl=k.length;best=p}})});return best}
function bulkKind(fn){var n=bulkNorm(fn);return /SDS|SICUREZZA/.test(n)?'sds':/ETICHETT|LABEL|SCHEDATECNICA/.test(n)?'scheda':'sds'}
function openBulk(){var d=dlgOpen('<h3>Carica PDF in blocco</h3><p class="mut">Scegli tutti i PDF insieme (schede di sicurezza ed etichette). Li abbino ai prodotti dal nome del file: controlla l’elenco e correggi se serve. I file senza “etichetta” nel nome sono trattati come schede di sicurezza.</p><input type="file" id="bk-f" accept="application/pdf" multiple><div id="bk-l"></div><div class="row" style="margin-top:14px"><button class="btn sp" id="bk-ok" style="display:none">Carica</button><button class="btn g" data-act="close">Chiudi</button></div>','min(96vw,760px)');
 var files=[];var opts=function(sel){return'<option value="">— non caricare —</option>'+F.prod.filter(function(p){return p.attivo}).map(function(p){return'<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+esc(p.nome)+'</option>'}).join('')};
 $('#bk-f').onchange=function(){files=Array.prototype.slice.call(this.files);$('#bk-l').innerHTML='<table style="margin-top:10px"><tr><th>File</th><th>Prodotto</th><th>Tipo</th></tr>'+files.map(function(f,i){var m=bulkMatch(f.name),k=bulkKind(f.name);if(m&&m.tipo==='concime')m=null;return'<tr data-i="'+i+'"><td style="word-break:break-all">'+esc(f.name)+'</td><td><select class="bk-p">'+opts(m&&m.id)+'</select></td><td><select class="bk-k"><option value="sds"'+(k==='sds'?' selected':'')+'>Scheda di sicurezza</option><option value="scheda"'+(k==='scheda'?' selected':'')+'>Etichetta / scheda prodotto</option></select></td></tr>'}).join('')+'</table>';$('#bk-ok').style.display=files.length?'':'none'};
 $('#bk-ok').onclick=async function(){var btn=this;btn.disabled=true;var ok=0,err=0,seen={};
  for(var tr of d.querySelectorAll('tr[data-i]')){var pid=+tr.querySelector('.bk-p').value;if(!pid)continue;var kind=tr.querySelector('.bk-k').value,f=files[+tr.dataset.i],p=F.prod.find(function(x){return x.id===pid});
   try{var path=p.nome.replace(/[^A-Z0-9]+/g,'_')+'/'+kind+'_'+Date.now()+'_'+ok+'.pdf';var up=await sb.storage.from('schede').upload(path,f,{contentType:'application/pdf'});if(up.error)throw up.error;var u={};u[kind+'_path']=path;var r=await sb.from('az_prodotti').update(u).eq('id',pid);if(r.error)throw r.error;ok++;tr.style.opacity=.5}catch(x){console.error(x);err++;tr.style.background='#f3d4d0'}}
  await loadFit();btn.disabled=false;toast(ok+' PDF caricati'+(err?' · '+err+' con errore (controlla i file in rosso)':' ✓'));if(!err){$('#dlg').close()}view()};
