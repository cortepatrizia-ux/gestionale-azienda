<style>

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif}
h1,h2,h3{font-family:var(--hd);margin:0;font-weight:700}h2{font-size:24px}h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
textarea{resize:vertical}label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
button{cursor:pointer}:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:11px 16px;font-weight:600}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font:700 28px var(--hd)}.kpi span{font-size:13px;color:var(--mut)}

@media(max-width:800px){.shell{display:block}.nav{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20;gap:0}
 .nav .brand,.nav .who,.nav .soon{display:none}.nav button.n{flex:1;flex-direction:column;gap:2px;font-size:11px;text-align:center;padding:7px 2px}main{padding:14px 14px 90px}}
.top{display:none}@media(max-width:800px){.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 0}.top b{font:700 17px var(--hd)}}
/* login */
.login{max-width:380px;margin:12vh auto;padding:0 16px}.login .card{padding:20px}.err{color:var(--bad);font-size:14px;margin-top:10px}

dialog{border:0;border-radius:14px;background:var(--bg);color:var(--ink);width:min(94vw,460px);max-height:92vh;padding:18px}dialog::backdrop{background:rgba(0,0,0,.45)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:99;max-width:90vw}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--mut);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

.cc.t .chart{display:none}.cc:not(.t) .tbl{display:none}
.hb{display:grid;grid-template-columns:minmax(80px,170px) 1fr 54px;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.hb .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .tr{height:14px;background:var(--bg);border-radius:0 7px 7px 0}.hb .fl{height:100%;background:var(--bar);border-radius:0 7px 7px 0;min-width:2px}.hb .v{text-align:right;font-variant-numeric:tabular-nums}

svg.ch text{fill:var(--mut);font-size:11px}svg.ch .gr{stroke:var(--line);stroke-width:1}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:13px;display:none;max-width:260px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.heat td{font-variant-numeric:tabular-nums}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal .dh{font-size:12px;color:var(--mut);text-align:center;padding:4px 0}
.cal .d{min-height:74px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;font-size:12px;overflow:hidden;cursor:pointer;text-align:left}
.cal .d.o{opacity:.45}.cal .d.today{border-color:var(--acc);border-width:2px}.cal .d.sel{background:var(--acc-soft)}
.cal .e{display:block;font-size:11px;padding:1px 4px;border-radius:4px;margin-top:2px;background:var(--acc-soft);color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cal .e.w{background:var(--warn-soft);color:var(--warn)}.cal .e.f{text-decoration:line-through;opacity:.6}
@media(max-width:600px){.cal .d{min-height:50px}.cal .e{font-size:0;height:6px;padding:0}}
.setup{white-space:pre-wrap;font-size:14px}

<script>

/* ============ UTIL ============ */
var $=function(s,r){return(r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return(n<10?'0':'')+n}

function addMonths(s,n){var d=pd(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)}
function fdate(s){var d=pd(s);return GS[(d.getDay()+6)%7]+' '+d.getDate()+' '+MS[d.getMonth()]}

function ico(n){var p={cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',team:'<circle cx="9" cy="8" r="3.5"/><path d="M2.500 20c0-3.600 2.900-6 6.500-6s6.500 2.400 6.500 6"/><circle cx="17.500" cy="9" r="2.500"/><path d="M17 14c3 0 4.500 2 4.500 5"/>',home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',leaf:'<path d="M5 19c0-9 5-14 15-14 0 10-5 15-14 15M5 19l8-8"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'};return'<svg viewBox="0 0 24 24">'+p[n]+'</svg>'}
async function fetchAll(mk){var out=[],from=0;for(;;){var r=await mk().range(from,from+999);if(r.error)throw r.error;out=out.concat(r.data);if(r.data.length<1000)break;from+=1000}return out}
function fail(e){console.error(e);var m=(e&&e.message)||String(e);if(e&&(e.code==='42P01'||/does not exist|schema cache/i.test(m)))m='Il database non è ancora pronto: esegui prima lo script SQL.';
 if(e&&/az_imposta_password/.test(m))m='Manca la funzione per cambiare le password: esegui lo script 03_password.sql in Supabase.';toast('Errore: '+m)}

/* ============ STATE ============ */
var S={user:null,prof:null,aree:[],att:[],pian:[],fatti:[],profili:[],view:'',
 f:{anno:String(new Date().getFullYear()),mese:'0',settore:'',oper:''},
 cal:{y:new Date().getFullYear(),m:new Date().getMonth(),sel:today()},
 ore:{y:new Date().getFullYear(),m:new Date().getMonth()},
 la:{mese:today().slice(0,7),oper:'',settore:''}};

function area(id){return S.aree.find(function(a){return a.id===id})}

function zonaDi(a){var r=area(a.area_id);return r?r.nome:''}
function areaLabel(id){var r=area(id);if(!r)return'—';return r.settore===r.nome?r.settore:r.settore+' · '+r.nome}
function nomeUtente(id){var p=S.profili.find(function(x){return x.id===id});return p?p.nome:''}

/* ============ LOGIN / BOOT ============ */
function renderLogin(msg){
 $('#app').innerHTML='<div class="login"><h1 style="font-size:28px;margin-bottom:4px">Azienda Agricola</h1><p class="mut" style="margin-top:0">Gestione attività, ore e calendario</p><form class="card" id="lf"><label>Email</label><input id="le" type="email" autocomplete="username" required><label>Password</label><input id="lp" type="password" autocomplete="current-password" required><button class="btn" style="width:100%;margin-top:16px" id="lb">Entra</button><div class="err" id="lerr">'+esc(msg||'')+'</div><p style="text-align:center;margin:14px 0 0"><a href="#" id="lfg" style="color:var(--acc)">Password dimenticata?</a></p></form></div>';
 $('#lfg').onclick=function(e){e.preventDefault();renderForgot()};
 $('#lf').onsubmit=async function(ev){ev.preventDefault();var b=$('#lb');b.disabled=true;$('#lerr').textContent='';
  var r=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});
  if(r.error){$('#lerr').textContent=r.error.message==='Invalid login credentials'?'Email o password non corrette.':r.error.message;b.disabled=false;return}
  S.user=r.data.user;await start()}
}
function renderForgot(){
 $('#app').innerHTML=`<div class="login"><h1 style="font-size:26px;margin-bottom:4px">Recupera la password</h1><p class="mut" style="margin-top:0">Scrivi la tua email: ti mandiamo un link per sceglierne una nuova.</p><form class="card" id="ff"><label>Email</label><input id="fe" type="email" autocomplete="username" required><button class="btn" style="width:100%;margin-top:16px" id="fb">Invia il link</button><div class="err" id="ferr"></div><p style="text-align:center;margin:14px 0 0"><a href="#" id="fback" style="color:var(--acc)">Torna all'accesso</a></p></form></div>`;
 $('#fback').onclick=function(e){e.preventDefault();renderLogin()};
 $('#ff').onsubmit=async function(ev){ev.preventDefault();var b=$('#fb');b.disabled=true;$('#ferr').textContent='';
  var r=await sb.auth.resetPasswordForEmail($('#fe').value.trim(),{redirectTo:location.origin+location.pathname});b.disabled=false;
  if(r.error){var m=r.error.message||'';$('#ferr').textContent=/rate limit/i.test(m)?'Troppe richieste: riprova tra un po.':/not authorized|not_authorized/i.test(m)?'L\'invio di email non è attivo per questo indirizzo. Chiedi al titolare di reimpostare la password.':'Non sono riuscito a inviare l\'email: '+m;return}
  $('#ff').innerHTML='<p>Se l\'indirizzo è registrato, riceverai un\'email con il link. Controlla anche la posta indesiderata.</p><button class="btn g" style="width:100%" type="button" id="fback2">Torna all\'accesso</button>';
  $('#fback2').onclick=function(){renderLogin()}}}
function renderNewPass(msg){
 $('#app').innerHTML=`<div class="login"><h1 style="font-size:26px;margin-bottom:4px">Scegli una nuova password</h1><form class="card" id="nf"><label>Nuova password (almeno 8 caratteri)</label><input id="np1" type="password" autocomplete="new-password" required><label>Ripetila</label><input id="np2" type="password" autocomplete="new-password" required><button class="btn" style="width:100%;margin-top:16px" id="nb">Salva e accedi</button><div class="err" id="nerr">${esc(msg||'')}</div></form></div>`;
 $('#nf').onsubmit=async function(ev){ev.preventDefault();var a=$('#np1').value;
  if(a.length<8){$('#nerr').textContent='Servono almeno 8 caratteri.';return}
  if(a!==$('#np2').value){$('#nerr').textContent='Le due password non coincidono.';return}
  var b=$('#nb');b.disabled=true;var r=await sb.auth.updateUser({password:a});
  if(r.error){b.disabled=false;$('#nerr').textContent=r.error.message;return}

function renderSetup(){
 $('#app').innerHTML='<div class="login" style="max-width:560px"><h2>Database da preparare</h2><div class="card setup">Le tabelle del gestionale non esistono ancora (o il tuo utente non ha accesso).\n\n1. Apri Supabase › SQL Editor.\n2. Incolla ed esegui <b>01_schema_azienda.sql</b> (prima sostituisci l’email nel punto 7).\n3. Esegui poi i tre file <b>02_import_storico</b>.\n4. Ricarica questa pagina.</div><button class="btn g" id="lo">Esci</button></div>';
 $('#lo').onclick=logout}
async function logout(){await sb.auth.signOut();S.user=null;S.prof=null;renderLogin()}
async function boot(){
 try{if(REC){var rs=await sb.auth.getSession();if(rs.data.session){S.user=rs.data.session.user;return renderNewPass()}return renderLogin('Il link non è valido o è scaduto: richiedine uno nuovo.')}
 if(RECERR){try{history.replaceState(null,'',location.pathname+location.search)}catch(x){}return renderLogin('Il link non è valido o è scaduto: richiedine uno nuovo.')}
 var r=await sb.auth.getSession();if(!r.data.session)return renderLogin();S.user=r.data.session.user;await start()}catch(e){renderLogin('Impossibile collegarsi al database: '+e.message)}}
async function start(){
 $('#app').innerHTML='<div class="login"><p class="mut">Caricamento…</p></div>';
 var p=await sb.from('az_profili').select('*').eq('id',S.user.id).maybeSingle();
 if(p.error){if(p.error.code==='42P01'||/does not exist|schema cache|permission denied/i.test(p.error.message))return renderSetup();return renderLogin(p.error.message)}
 if(!p.data||!p.data.attivo){await sb.auth.signOut();return renderLogin('Questo account non è abilitato. Contatta il titolare.')}
 S.prof=p.data;
 try{await loadAll()}catch(e){fail(e);return renderLogin('Errore nel caricamento dei dati.')}
 if(isM()){var ys=S.att.map(function(a){return a.data.slice(0,4)});if(ys.length&&ys.indexOf(S.f.anno)<0)S.f.anno=ys.reduce(function(a,b){return a>b?a:b});var ms=S.att.map(function(a){return a.data.slice(0,7)});if(ms.length&&ms.indexOf(S.la.mese)<0)S.la.mese=ms.reduce(function(a,b){return a>b?a:b})}
 S.view=isM()?'stat':'oggi';render()}

 var a=await sb.from('az_aree').select('*').eq('attiva',true).order('ordine');if(a.error)throw a.error;S.aree=a.data;
 if(isM()){var pr=await sb.from('az_profili').select('*').order('nome');if(pr.error)throw pr.error;S.profili=pr.data}
 await loadAtt();await loadPian();if(isM())await loadVig();else await loadFilari()}

 var p=await sb.from('az_pianificazioni').select('*').order('data');if(p.error)throw p.error;S.pian=p.data;

/* ============ SHELL ============ */
function navItems(){return isM()?[['stat','chart','Statistiche'],['cal','cal','Calendario'],['vig','leaf','Vigneto'],['att','list','Attività'],['team','team','Squadra']]:[['oggi','home','Oggi'],['ore','clock','Le mie ore']]}
function render(){

 ar.forEach(function(a){var t=vigTot(a.id),mx=t.fs.reduce(function(m,f){return Math.max(m,f.n_vigne)},1),W=600,L=34,RH=6,G=1.5,H=t.n*(RH+G)+8,vs=[];

  out+='<div class="card"><div class="row"><h3 class="sp">'+esc(a.nome)+'</h3><span class="mut">'+t.n+' filari · ogni barra è un filare, lunga quanto le sue viti</span></div><div class="leg">'+leg+'</div><svg class="ch" viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:640px;display:block">'+svg+'</svg></div>'});
